version: '3.8'

services:
  postgres:
    image: postgis/postgis:15-3.3
    container_name: bhoomisetu-postgis
    restart: always
    environment:
      POSTGRES_DB: bhoomisetu_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgrespassword
    ports:
      - '5432:5432'
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U postgres']
      interval: 10s
      timeout: 5s
      retries: 5

  backend:
    build: ./backend
    container_name: bhoomisetu-backend
    restart: always
    environment:
      PORT: 5000
      JWT_SECRET: bhoomisetu-sih2026-super-secret-key
      DATABASE_URL: postgresql://postgres:postgrespassword@postgres:5432/bhoomisetu_db
    ports:
      - '5000:5000'
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build: ./frontend
    container_name: bhoomisetu-frontend
    restart: always
    ports:
      - '3000:3000'
    depends_on:
      - backend

volumes:
  pgdata:
